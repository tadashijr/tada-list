name: Deploy TADA-List

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug — checar secrets (não mostra valores, só se estão vazias)
        env:
          FIREBASE_API_KEY:             ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN:         ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID:          ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET:      ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID:              ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID:      ${{ secrets.FIREBASE_MEASUREMENT_ID }}
        run: |
          echo "=== STATUS DAS SECRETS ==="
          [ -z "$FIREBASE_API_KEY" ]             && echo "❌ FIREBASE_API_KEY: VAZIA"             || echo "✅ FIREBASE_API_KEY: OK (${#FIREBASE_API_KEY} chars)"
          [ -z "$FIREBASE_AUTH_DOMAIN" ]         && echo "❌ FIREBASE_AUTH_DOMAIN: VAZIA"         || echo "✅ FIREBASE_AUTH_DOMAIN: OK (${#FIREBASE_AUTH_DOMAIN} chars)"
          [ -z "$FIREBASE_PROJECT_ID" ]          && echo "❌ FIREBASE_PROJECT_ID: VAZIA"          || echo "✅ FIREBASE_PROJECT_ID: OK (${#FIREBASE_PROJECT_ID} chars)"
          [ -z "$FIREBASE_STORAGE_BUCKET" ]      && echo "❌ FIREBASE_STORAGE_BUCKET: VAZIA"      || echo "✅ FIREBASE_STORAGE_BUCKET: OK (${#FIREBASE_STORAGE_BUCKET} chars)"
          [ -z "$FIREBASE_MESSAGING_SENDER_ID" ] && echo "❌ FIREBASE_MESSAGING_SENDER_ID: VAZIA" || echo "✅ FIREBASE_MESSAGING_SENDER_ID: OK (${#FIREBASE_MESSAGING_SENDER_ID} chars)"
          [ -z "$FIREBASE_APP_ID" ]              && echo "❌ FIREBASE_APP_ID: VAZIA"              || echo "✅ FIREBASE_APP_ID: OK (${#FIREBASE_APP_ID} chars)"
          [ -z "$FIREBASE_MEASUREMENT_ID" ]      && echo "⚠️  FIREBASE_MEASUREMENT_ID: VAZIA (opcional)" || echo "✅ FIREBASE_MEASUREMENT_ID: OK (${#FIREBASE_MEASUREMENT_ID} chars)"
          echo ""
          echo "=== PLACEHOLDERS NO HTML ANTES DA SUBSTITUIÇÃO ==="
          grep -o "__FIREBASE_[A-Z_]*__" index.html | sort | uniq || echo "(nenhum encontrado — verifique o nome do arquivo)"
          echo ""
          echo "=== ARQUIVO HTML ENCONTRADO ==="
          ls -la *.html 2>/dev/null || echo "❌ Nenhum .html na raiz do repositório!"

      - name: Inject Firebase secrets into HTML
        env:
          FIREBASE_API_KEY:             ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN:         ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID:          ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET:      ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID:              ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID:      ${{ secrets.FIREBASE_MEASUREMENT_ID }}
        run: |
          python3 - <<'EOF'
          import os

          with open("tada-list.html", "r", encoding="utf-8") as f:
              html = f.read()

          replacements = {
              "__FIREBASE_API_KEY__":             os.environ["FIREBASE_API_KEY"],
              "__FIREBASE_AUTH_DOMAIN__":         os.environ["FIREBASE_AUTH_DOMAIN"],
              "__FIREBASE_PROJECT_ID__":          os.environ["FIREBASE_PROJECT_ID"],
              "__FIREBASE_STORAGE_BUCKET__":      os.environ["FIREBASE_STORAGE_BUCKET"],
              "__FIREBASE_MESSAGING_SENDER_ID__": os.environ["FIREBASE_MESSAGING_SENDER_ID"],
              "__FIREBASE_APP_ID__":              os.environ["FIREBASE_APP_ID"],
              "__FIREBASE_MEASUREMENT_ID__":      os.environ.get("FIREBASE_MEASUREMENT_ID", ""),
          }

          for placeholder, value in replacements.items():
              if placeholder in html:
                  html = html.replace(placeholder, value)
                  print(f"✅ Substituído: {placeholder}")
              else:
                  print(f"⚠️  Não encontrado no HTML: {placeholder}")

          with open("tada-list.html", "w", encoding="utf-8") as f:
              f.write(html)

          print("✅ tada-list.html salvo.")
          EOF

      - name: Debug — confirmar substituição
        run: |
          echo "=== PLACEHOLDERS RESTANTES APÓS SUBSTITUIÇÃO ==="
          grep -o "__FIREBASE_[A-Z_]*__" tada-list.html && echo "❌ FALHOU — placeholders ainda presentes!" || echo "✅ Nenhum placeholder restante — substituição OK!"

      - name: Abort if placeholders remain
        run: |
          if grep -q "__FIREBASE_API_KEY__" tada-list.html; then
            echo "❌ Deploy abortado: secrets não foram injetadas corretamente."
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
